name: Channel server integration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  socket:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: make -j2
      - run: python3 tests/runtime/registration.py
      - run: python3 tests/runtime/channel_modes.py
      - run: python3 tests/runtime/permissions.py
      - name: Install the reference client
        run: sudo apt-get -o Acquire::Retries=2 update && sudo apt-get -y install irssi python3-pexpect
      - name: Verify MODE and NAMES through irssi
        run: /usr/bin/python3 tests/runtime/irssi_modes.py
