name: NET unit tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
env:
  CXXFLAGS: -O3 -Wall -Wextra -Werror -Iinclude -std=c++98
  SRC_FILE: >-
            src/net/parsers.cpp
            src/net/ScopedSocket.cpp
            src/net/ClientRecord.cpp
            src/net/ServerConfig.cpp

jobs:
  net:
    name: C++98 (${{ matrix.os }}, ${{ matrix.cxx }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cxx: g++
          - os: ubuntu-latest
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Build and run focused ServerConfig test
        env:
          CXX: ${{ matrix.cxx }}
        run: python3 tests/net/run.py --suite config
      - name: Build and run focused Server Socket test
        env:
          CXX: ${{ matrix.cxx }}
        run: python3 tests/net/run.py --suite socket
      - name: Build and run focused recv result test
        env:
          CXX: ${{ matrix.cxx }}
        run: python3 tests/net/run.py --suite read_lines
      - name: Build and run focused disconnect notification test
        env:
          CXX: ${{ matrix.cxx }}
        run: python3 tests/net/run.py --suite disconnect_order
  sanitizers:
    name: Valgrind & Sanitizers (NET)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Valgrind is available
        timeout-minutes: 5
        run: bash .github/scripts/ensure-valgrind.sh
      - name: Check memory leaks (ServerConfig)
        env:
          CXX: clang++
        run: python3 tests/net/run.py --suite config --sanitizers
      - name: Check memory leaks (Socket config)
        env:
          CXX: clang++
        run: python3 tests/net/run.py --suite socket --sanitizers
      - name: Check memory leaks (recv result)
        env:
          CXX: clang++
        run: python3 tests/net/run.py --suite read_lines --sanitizers
      - name: Check leaks (disconnect notification)
        env:
          CXX: clang++
        run: python3 tests/net/run.py --suite disconnect_order --sanitizers