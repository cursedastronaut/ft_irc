name: NET unit tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
env:
  CXXFLAGS: -O3 -Wall -Wextra -Werror -Iinclude -std=c++98
  SRC_FILE: >-
            src/net/parsers.cpp
            src/net/ScopedSocket.cpp
            src/net/ClientRecord.cpp
            src/net/ServerConfig.cpp

jobs:
  net:
    name: C++98 (${{ matrix.os }}, ${{ matrix.cxx }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cxx: g++
          - os: ubuntu-latest
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Build and run focused ServerConfig test
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          $CXX $CXXFLAGS $SRC_FILE tests/net/test_config.cpp -o test_config
          ./test_config
          rm -f test_config
      - name: Build and run focused Server Socket test
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          $CXX $CXXFLAGS $SRC_FILE tests/net/test_socket_config.cpp -o test_socket_config
          ./test_socket_config
          rm -f test_socket_config
  sanitizers:
    name: Valgrind & Sanitizers (NET)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Valgrind is available
        timeout-minutes: 5
        run: bash .github/scripts/ensure-valgrind.sh
      - name: Check memory leaks (ServerConfig)
        env:
          CXX: clang++
        run: |
          $CXX $CXXFLAGS $SRC_FILE tests/net/test_config.cpp -o test_config
          valgrind --leak-check=full --track-fds=yes --error-exitcode=1 ./test_config
          rm -f test_config
      - name: Check memory leaks (Socket config)
        env:
          CXX: clang++
        run: |
          $CXX $CXXFLAGS $SRC_FILE tests/net/test_socket_config.cpp -o test_socket_config
          valgrind --leak-check=full --track-fds=yes --error-exitcode=1 ./test_socket_config
          rm -f test_socket_config